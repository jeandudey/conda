[workspace]
authors = ["Jean-Pierre De Jesus DIAZ <me@jeandudey.tech>"]
channels = ['conda-forge']
name = "recipes"
platforms = ['linux-64']
version = "0.1.0"

[activation.env]
RATTLER_BUILD_ARGS = "-m $CONDA_PREFIX/conda_build_config.yaml -m channels.yaml --error-unused-staging-files"

[tasks]
build-gst-plugins-bad = { cmd = "rattler-build build $RATTLER_BUILD_ARGS --recipe-dir ./recipes/gst-plugins-bad", inputs = [
    "recipes/gst-plugins-bad/**",
], outputs = [
    "output/linux-64/gst-plugins-bad-*.conda",
], depends-on = [
    "build-gst-plugins-bad",
    "build-gstreamer",
] }
build-gst-plugins-base = { cmd = "rattler-build build $RATTLER_BUILD_ARGS --recipe-dir ./recipes/gst-plugins-base", inputs = [
    "recipes/gst-plugins-base/**",
], outputs = [
    "output/linux-64/gst-plugins-base-*.conda",
], depends-on = [
    "build-gstreamer",
] }
build-gst-plugins-good = { cmd = "rattler-build build $RATTLER_BUILD_ARGS --recipe-dir ./recipes/gst-plugins-good", inputs = [
    "recipes/gst-plugins-good/**",
], outputs = [
    "output/linux-64/gst-plugins-good-*.conda",
], depends-on = [
    "build-gst-plugins-base",
    "build-gstreamer",
] }
build-gst-plugins-rs = { cmd = "rattler-build build $RATTLER_BUILD_ARGS --recipe-dir ./recipes/gst-plugins-rs", inputs = [
    "recipes/gst-plugins-rs/**",
], outputs = [
], depends-on = [
    "build-gst-plugins-bad",
    "build-gst-plugins-base",
    "build-gstreamer",
] }
build-gstreamer = { cmd = "rattler-build build $RATTLER_BUILD_ARGS --recipe-dir ./recipes/gstreamer", inputs = [
    "recipes/gstreamer/**",
], outputs = [
    "output/linux-64/gstreamer-*.conda",
] }
build-pipewire = { cmd = "rattler-build build $RATTLER_BUILD_ARGS --recipe-dir ./recipes/pipewire", inputs = [
    "recipes/pipewire/**",
], outputs = [
    "output/linux-64/gst-plugin-pipewire-*.conda",
    "output/linux-64/pipewire-*.conda",
], depends-on = [
    "build-gstreamer",
] }
build-rocjpeg = { cmd = "rattler-build build $RATTLER_BUILD_ARGS --recipe-dir ./recipes/rocjpeg", outputs = [
    "output/linux-64/rocjpeg-*.conda",
    "output/linux-64/librocjpeg-devel-*.conda",
    "output/linux-64/librocjpeg-*.conda",
] }

publish-gst-plugins-bad = { cmd = "rattler-build upload prefix --channel jeandudey/conda --skip-existing output/linux-64/gst-plugins-bad-*.conda", depends-on = [
    "build-gst-plugins-bad",
] }
publish-gst-plugins-base = { cmd = "rattler-build upload prefix --channel jeandudey/conda --skip-existing output/linux-64/gst-plugins-base-*.conda", depends-on = [
    "build-gst-plugins-base",
] }
publish-gst-plugins-good = { cmd = "rattler-build upload prefix --channel jeandudey/conda --skip-existing output/linux-64/gst-plugins-good-*.conda", depends-on = [
    "build-gst-plugins-good",
] }
publish-gst-plugins-rs = { cmd = "rattler-build upload prefix --channel jeandudey/conda --skip-existing output/linux-64/gst-plugins-rs-*.conda", depends-on = [
    "build-gst-plugins-rs",
] }
publish-gstreamer = { cmd = "rattler-build upload prefix --channel jeandudey/conda --skip-existing output/linux-64/gstreamer-*.conda", depends-on = [
    "build-gstreamer",
] }
publish-pipewire = { cmd = "rattler-build upload prefix --channel jeandudey/conda --skip-existing output/linux-64/pipewire-*.conda output/linux-64/pipewire-*.conda", depends-on = [
    "build-pipewire",
] }
publish-gst-plugin-pipewire = { cmd = "rattler-build upload prefix --channel jeandudey/conda --skip-existing output/linux-64/gst-plugin-pipewire-*.conda output/linux-64/gst-plugin-pipewire-*.conda", depends-on = [
    "build-pipewire",
] }
publish-rocjpeg = { cmd = "rattler-build upload prefix --channel jeandudey/conda --skip-existing output/linux-64/rocjpeg-*.conda output/linux-64/librocjpeg-*.conda", depends-on = [
    "build-rocjpeg",
] }

[dependencies]
conda-forge-pinning = "*"
rattler-build = ">=0.81.0,<0.82"
